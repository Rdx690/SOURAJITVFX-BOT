<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>𝐒ꭷᴜʀᴀᴊɪᴛ メ 𝐕𝐅𝐗 · Pair</title>
<style>
:root{
  --bg:#000;
  --panel:#0b0b0d;
  --line:#1e1e24;
  --line-hi:#34343e;
  --text:#f4f4f6;
  --mute:#8a8a96;
  --acc:#00e5ff;
  --acc2:#7c5cff;
  --ok:#2ee59d;
  --warn:#ffb020;
  --err:#ff4d6d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px 16px;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(600px 300px at 50% 0%,rgba(0,229,255,.10),transparent 70%),
    radial-gradient(500px 300px at 50% 100%,rgba(124,92,255,.10),transparent 70%);
}
.card{
  position:relative;width:100%;max-width:420px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:30px 24px 22px;
  box-shadow:0 0 0 1px #000,0 30px 80px rgba(0,0,0,.8);
}
.card::before{
  content:"";position:absolute;left:24px;right:24px;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);
}
.brand{text-align:center;margin-bottom:22px}
.brand .mark{
  width:54px;height:54px;margin:0 auto 14px;border-radius:16px;
  display:grid;place-items:center;font-size:24px;font-weight:800;
  background:#000;border:1px solid var(--line-hi);
  box-shadow:0 0 24px rgba(0,229,255,.25),inset 0 0 14px rgba(124,92,255,.25);
  color:var(--acc);
}
.brand h1{
  font-size:22px;line-height:1.25;letter-spacing:.5px;font-weight:700;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  word-break:break-word;
}
.brand p{margin-top:6px;color:var(--mute);font-size:13px}

label{display:block;font-size:12px;letter-spacing:1px;color:var(--mute);margin:0 0 8px 2px;text-transform:uppercase}
.field{
  display:flex;align-items:center;gap:8px;
  background:#000;border:1px solid var(--line-hi);border-radius:12px;padding:0 14px;
  transition:border-color .2s, box-shadow .2s;
}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,229,255,.12)}
.field span{color:var(--mute);font-size:16px}
.field input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);
  font-size:17px;letter-spacing:1.5px;padding:15px 0;font-variant-numeric:tabular-nums;
}
.field input::placeholder{color:#4a4a55;letter-spacing:1px}
.hint{display:block;margin:8px 2px 0;font-size:12px;color:var(--mute)}

.btns{display:grid;gap:10px;margin-top:18px}
button{
  font:inherit;cursor:pointer;border-radius:12px;padding:14px 16px;font-weight:600;
  letter-spacing:.6px;font-size:14px;transition:transform .08s, opacity .2s, border-color .2s, background .2s;
}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{
  border:0;color:#001014;
  background:linear-gradient(90deg,var(--acc),#6ff3ff);
  box-shadow:0 8px 28px rgba(0,229,255,.22);
}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line-hi)}
.ghost:hover:not(:disabled){border-color:var(--acc2);background:rgba(124,92,255,.08)}

.result{
  margin-top:20px;border:1px dashed var(--line-hi);border-radius:14px;
  padding:18px 14px;text-align:center;min-height:92px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  transition:border-color .25s;
}
.result.success{border-style:solid;border-color:var(--ok)}
.result.error{border-style:solid;border-color:var(--err)}
.result.warning{border-style:solid;border-color:var(--warn)}
.result.info{border-style:solid;border-color:var(--acc)}
.msg{font-size:14px;line-height:1.5;color:var(--mute);white-space:pre-line}
.result.error .msg{color:var(--err)}
.result.warning .msg{color:var(--warn)}
.result.info .msg{color:var(--acc)}
.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:clamp(28px,9vw,36px);font-weight:800;letter-spacing:5px;color:var(--ok);
  text-shadow:0 0 22px rgba(46,229,157,.35);user-select:all;
}
.copy{
  padding:9px 18px;font-size:13px;border-radius:10px;
  background:transparent;color:var(--ok);border:1px solid var(--ok);
}
.copy:hover{background:rgba(46,229,157,.1)}
.spin{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--line-hi);border-top-color:var(--acc);animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

.steps{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--mute);line-height:1.7}
.steps b{color:var(--text);font-weight:600}

.foot{margin-top:18px;text-align:center;font-size:12px;color:#5d5d68}
.foot em{font-style:normal;color:var(--text)}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:#0f0f12;border:1px solid var(--line-hi);color:var(--text);
  padding:11px 18px;border-radius:12px;font-size:13px;transition:.25s;z-index:10;max-width:90vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{border-color:var(--ok)}
.toast.error{border-color:var(--err)}
</style>
</head>
<body>

<main class="card">
  <header class="brand">
    <div class="mark">S</div>
    <h1>𝐒ꭷᴜʀᴀᴊɪᴛ メ 𝐕𝐅𝐗</h1>
    <p>WhatsApp bot · pairing code</p>
  </header>

  <label for="number">WhatsApp number</label>
  <div class="field">
    <span>+</span>
    <input id="number" type="tel" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="916909950582" autofocus>
  </div>
  <small class="hint">Country code ke saath, bina + ya space ke.</small>

  <div class="btns">
    <button class="primary" id="pairBtn" type="button">GET PAIR CODE</button>
    <button class="ghost" id="forceBtn" type="button">FORCE PAIR (reset old session)</button>
  </div>

  <section class="result" id="result" aria-live="polite">
    <div class="msg">Apna number daalo aur code lo.</div>
  </section>

  <div class="steps">
    <b>Kaise link karein:</b> WhatsApp → Settings → <b>Linked Devices</b> → <b>Link with phone number</b> → code enter karo.
  </div>

  <footer class="foot">Owner <em>SOURAJIT SARKAR</em> · <em>𝐒ꭷᴜʀᴀᴊɪᴛ メ 𝐕𝐅𝐗</em></footer>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var numberEl = $('number'), resultEl = $('result'), pairBtn = $('pairBtn'), forceBtn = $('forceBtn');
  var busy = false, currentCode = '';

  function toast(text, type) {
    var t = $('toast');
    t.textContent = text;
    t.className = 'toast show ' + (type || '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  function setBusy(v) { busy = v; pairBtn.disabled = v; forceBtn.disabled = v; }

  function show(kind, text) {
    resultEl.innerHTML = '';
    if (kind === 'loading') {
      resultEl.className = 'result info';
      var s = document.createElement('div'); s.className = 'spin';
      var m = document.createElement('div'); m.className = 'msg'; m.textContent = text;
      resultEl.appendChild(s); resultEl.appendChild(m);
      return;
    }
    resultEl.className = 'result ' + (kind || '');
    var msg = document.createElement('div'); msg.className = 'msg'; msg.textContent = text;
    resultEl.appendChild(msg);
  }

  function showCode(code) {
    currentCode = String(code);
    var pretty = (currentCode.length === 8 && currentCode.indexOf('-') < 0)
      ? currentCode.slice(0, 4) + '-' + currentCode.slice(4) : currentCode;
    resultEl.className = 'result success';
    resultEl.innerHTML = '';
    var c = document.createElement('div'); c.className = 'code'; c.textContent = pretty;
    var b = document.createElement('button'); b.className = 'copy'; b.type = 'button'; b.textContent = 'Copy code';
    b.onclick = copyCode;
    resultEl.appendChild(c); resultEl.appendChild(b);
  }

  function copyCode() {
    var text = currentCode;
    function done() { toast('Code copied', 'success'); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed', 'error'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  }

  function getNumber() {
    var n = numberEl.value.replace(/\D/g, '');
    if (n.length < 8 || n.length > 15) {
      show('error', 'Valid number daalo (country code ke saath).\nExample: 916909950582');
      numberEl.focus();
      return null;
    }
    return n;
  }

  function getJSON(url, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms || 60000);
    return fetch(url, { signal: ctl.signal, cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (d) { clearTimeout(timer); return d; },
            function (e) { clearTimeout(timer); throw e; });
  }

  function handle(data) {
    if (data && data.code) {
      showCode(data.code);
      toast('Code ready', 'success');
      return;
    }
    var st = data && data.status;
    if (st === 'already_connected') {
      show('warning', 'Ye number already connected hai.\nNaya code chahiye to FORCE PAIR dabao.');
    } else if (st === 'connection_in_progress') {
      show('warning', 'Connection chal raha hai.\n10 second baad dubara try karo.');
    } else if (st === 'reconnecting') {
      show('warning', (data.message || 'Purane session se reconnect ho raha hai.') + '\nAgar nahi hua to FORCE PAIR use karo.');
    } else {
      show('error', (data && (data.message || data.error)) || 'Pairing fail hua. FORCE PAIR try karo.');
      toast('Pairing failed', 'error');
    }
  }

  function run(path, num, loadingText) {
    setBusy(true);
    show('loading', loadingText);
    return getJSON(path + '?number=' + num, 70000)
      .then(handle)
      .catch(function (e) {
        show('error', (e && e.name === 'AbortError')
          ? 'Server ne time par reply nahi diya. Dubara try karo.'
          : 'Server se connect nahi ho paya.');
        toast('Network error', 'error');
      })
      .then(function () { setBusy(false); });
  }

  function pair() {
    if (busy) return;
    var num = getNumber(); if (!num) return;
    setBusy(true);
    show('loading', 'Number check ho raha hai...');
    getJSON('/pair-status?number=' + num, 15000)
      .then(function (d) { return (d && d.data) || {}; }, function () { return {}; })
      .then(function (info) {
        setBusy(false);
        if (info.isActive) {
          show('warning', 'Ye number already connected hai.\nNaya code chahiye to FORCE PAIR dabao.');
          return;
        }
        return run('/code', num, 'Pair code ban raha hai...');
      });
  }

  function force() {
    if (busy) return;
    var num = getNumber(); if (!num) return;
    if (!confirm('FORCE PAIR purana session delete karke naya code banayega.\nBot ka current session disconnect ho jayega. Continue?')) return;
    run('/force-code', num, 'Purana session hata kar naya code ban raha hai...');
  }

  pairBtn.addEventListener('click', pair);
  forceBtn.addEventListener('click', force);
  numberEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); pair(); } });
  numberEl.addEventListener('input', function () { numberEl.value = numberEl.value.replace(/\D/g, ''); });

  try {
    var q = new URLSearchParams(location.search).get('number');
    if (q) numberEl.value = q.replace(/\D/g, '');
  } catch (e) {}
})();
</script>
</body>
</html>
